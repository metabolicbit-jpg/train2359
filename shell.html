<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>قطار ۲۳:۵۹ | Train 23:59</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#080a18;color:#fff;font-family:'Vazirmatn',-apple-system,Tahoma,Arial,sans-serif;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ic{width:16px;height:16px;display:inline-block;vertical-align:middle;flex:none}.ic.s{width:13px;height:13px}
.tbar{position:fixed;top:0;left:0;right:0;z-index:3;pointer-events:none;padding:calc(6px + env(safe-area-inset-top)) 10px 0;display:flex;flex-direction:column;gap:7px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px}
.clock{font-weight:800;font-size:18px;color:#ffd76a;text-shadow:0 0 14px rgba(255,200,80,.45);font-variant-numeric:tabular-nums}
.hudR{display:flex;align-items:center;gap:5px}
.stn{display:none}
.scrapB{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);padding:4px 8px;border-radius:5px;color:#d0d7e6;font-size:12px;font-weight:700;white-space:nowrap}
.hbtn{pointer-events:auto;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:5px;min-width:30px;height:28px;padding:0 6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;flex:none}
.res{display:flex;justify-content:center;gap:5px;flex-wrap:nowrap;width:100%}
.chip{background:rgba(12,16,32,.6);border:1px solid rgba(255,255,255,.11);border-radius:5px;padding:5px 6px;width:66px;display:flex;flex-direction:column;gap:3px;align-items:center;flex:none}
.chip .top{display:flex;align-items:center;gap:4px}.chip .lbl{font-size:8.5px;color:#aaa}
.chip .bar{width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.chip .fill{height:100%;width:50%;border-radius:2px;transition:width .4s}
.chip .val{font-size:9.5px;color:#fff;font-weight:700;line-height:1}
.chip.crit{border-color:rgba(255,90,90,.7);animation:pu 1.1s infinite}@keyframes pu{50%{background:rgba(20,20,20,.5)}}
.bars{display:flex;flex-direction:column;gap:4px;width:100%;padding:0 4px}
.barRow{display:flex;align-items:center;gap:7px}
.barLbl{font-size:9px;color:#888;width:36px;text-align:start}
.track{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.track i{display:block;height:100%;width:0;border-radius:2px;background:linear-gradient(90deg,#ffd76a,#ff9d3c);transition:width .5s}
.track.red i{background:linear-gradient(90deg,#ff5a5a,#8b1e1e)}
.pax{display:flex;justify-content:center;gap:6px;opacity:.9;width:100%}
.panel{position:fixed;left:0;right:0;bottom:0;padding:11px 13px;padding-bottom:calc(11px + env(safe-area-inset-bottom));z-index:4;background:linear-gradient(0deg,rgba(6,8,18,.98),rgba(6,8,18,.72) 66%,rgba(6,8,18,0));display:flex;flex-direction:column;gap:7px;align-items:center;max-height:60%;overflow-y:auto}
.ptitle{color:#fff;font-size:13.5px;font-weight:800;text-align:center;display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
.ptitle b{color:#ffd76a}.ptitle span{color:#c89bff}
.pdesc{color:#ddd;font-size:12.5px;text-align:center;max-width:440px;line-height:1.7;min-height:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:460px}.grid.wide{grid-template-columns:1fr}
.choice{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:12.5px;font-weight:600;padding:10px 8px;border-radius:5px;cursor:pointer;font-family:inherit;line-height:1.45;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.choice:active{transform:scale(.98);background:rgba(255,215,120,.16)}
.choice.dim{opacity:.45}.choice.gold{background:linear-gradient(135deg,#ffd76a,#ff9d3c);color:#241a04;border:none}
.choice .sub{display:block;width:100%;font-size:9.5px;opacity:.72;font-weight:500}
.btn{background:linear-gradient(135deg,#ffd76a,#ff9d3c);color:#241a04;font-weight:800;font-size:15px;padding:12px 30px;border:none;border-radius:5px;box-shadow:0 10px 24px rgba(255,160,60,.32);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:scale(.97)}.btn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.2)}
.pnote{font-size:10px;color:#777}
.tnote{position:fixed;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));text-align:center;color:#eee;font-size:13.5px;z-index:4;pointer-events:none;opacity:0;transition:opacity .35s}.tnote.on{opacity:1}
.hidden{display:none!important}
#hideBtn{position:fixed;inset-inline-start:8px;top:50%;transform:translateY(-50%);z-index:9;pointer-events:auto;background:rgba(12,16,32,.55);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#vetBtn{position:fixed;left:3%;top:22%;width:24%;height:30%;z-index:7;background:transparent;border:none;cursor:pointer}
#bubble{position:fixed;left:23%;top:18%;max-width:66%;background:rgba(10,14,26,.96);border:1px solid rgba(255,215,120,.38);border-radius:5px;padding:9px 11px;font-size:12px;line-height:1.7;color:#eee;z-index:7;box-shadow:0 8px 24px rgba(0,0,0,.45);cursor:pointer}
#bubble:after{content:'';position:absolute;inset-inline-start:-9px;top:14px;border:6px solid transparent;border-inline-end-color:rgba(255,215,120,.38)}
#bubble .who{display:block;font-size:10px;color:#ffd76a;font-weight:700;margin-bottom:2px}
body.hideui .tbar,body.hideui .panel,body.hideui .tnote,body.hideui #bubble{display:none!important}
.overlay{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;background:radial-gradient(ellipse at 50% 26%,rgba(46,34,80,.72),rgba(4,6,14,.97))}
h1{font-size:32px;color:#fff;font-weight:800;margin-bottom:10px}h1 span{color:#ffd76a}
.tag{color:#ccc;font-size:13px;line-height:1.95;margin-bottom:20px;max-width:430px;white-space:pre-line}
.stats{color:#ffd76a;font-size:12.5px;line-height:2.1;margin-bottom:16px}
.brand{position:fixed;inset-inline-end:16px;bottom:calc(8px + env(safe-area-inset-bottom));color:rgba(255,255,255,.28);font-size:10px;z-index:5}
.sheet{position:fixed;inset:0;z-index:8;background:rgba(5,7,16,.99);padding:20px 16px 60px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet h2{margin-bottom:14px;font-size:21px}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:5px;padding:13px 14px;margin-bottom:11px}
.card .chd{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.card .ci{width:34px;height:34px;border-radius:5px;display:flex;align-items:center;justify-content:center;background:rgba(255,215,120,.12);color:#ffd76a;flex:none}
.card h3{font-size:14.5px;color:#fff;margin:0}
.card p{font-size:12.5px;color:#ddd;line-height:1.85}
.k{color:#ffd76a;font-weight:700}
.clue{background:rgba(255,255,255,.06);border-inline-start:3px solid #ffd76a;border-radius:5px;padding:10px 12px;margin-bottom:9px;font-size:12.5px;color:#ddd;line-height:1.7}
.lk{opacity:.35;filter:grayscale(1)}
.mini{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin:3px 0 9px}
.mini i{display:block;height:100%;border-radius:3px}
#err{position:fixed;inset-inline:8px;top:8px;z-index:99;background:#5a1414;color:#fff;font-size:11px;padding:8px;border-radius:5px;direction:ltr;text-align:left}
</style>
</head>
<body>

  <div class="hud">
    <div class="clock" id="clock">۲۳:۵۹</div>
    <div class="hudR">
      <div class="stn" id="stnBox">ایستگاه <b id="stnNow">۱</b>/<b id="stnTot">۱۵</b></div>
      <div class="scrapB"><span id="scrapIc"></span><span id="scrapVal">۰</span></div>

<div class="overlay hidden" id="titleScreen"><h1 id="titleH1">قطار <span>۲۳:۵۹</span></h1><div class="tag" id="titleTag"></div><button class="btn" id="startBtn">شروع سفر</button><button class="btn ghost" id="helpBtnTitle" style="margin-top:10px">راهنمای بازی</button></div>

<script>window.onerror=function(m,s,l,c){var b=document.getElementById('err');if(b){b.textContent='JS: '+m+' '+l+':'+c;b.classList.remove('hidden');}};</script>
<script>
(function(){
var BASE='https://cdn.jsdelivr.net/gh/metabolicbit-jpg/train2359@main/';
var VER='v41';
var MODS=['src/lang.js','src/audio.js','src/render.js','src/ui.js','src/core.js','src/main.js'];
function cg(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function cs(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function inject(t){var s=document.createElement('script');s.textContent=t;document.body.appendChild(s);}
function fail(msg){document.getElementById('loadMsg').textContent=msg;document.getElementById('retryBtn').classList.remove('hidden');}
function load(i){
  if(i>=MODS.length){ if(typeof T59boot==='function'){T59boot();} else {fail('خطا در راه‌اندازی.');} return; }
  var src=MODS[i],key='m_'+VER+'_'+src;
  fetch(BASE+src,{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text();})
    .then(function(t){cs(key,t);inject(t);load(i+1);})
    .catch(function(){var c=cg(key);if(c){inject(c);load(i+1);}else{fail('برای اولین بار به اینترنت وصل شو و بازی را باز کن (بعد آفلاین هم کار می‌کند).');}});
}
document.getElementById('retryBtn').addEventListener('click',function(){location.reload();});
load(0);
})();
</script>
